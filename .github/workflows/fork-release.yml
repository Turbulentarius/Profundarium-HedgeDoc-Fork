name: Publish fork release image

on:
  push:
    tags:
      - 'profundarium-v1.*-*'

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'Turbulentarius/Profundarium-HedgeDoc-Fork'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate fork tag and stable branch ancestry
        env:
          RELEASE: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE" =~ ^profundarium-v1\.[0-9]+\.[0-9]+-[1-9][0-9]*$ ]]
          base_version="$(node -p 'require("./package.json").version')"
          [[ "$RELEASE" == "profundarium-v${base_version}-"* ]]
          git merge-base --is-ancestor HEAD origin/master
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE" >> "$GITHUB_ENV"

      - name: Build and test release image
        env:
          RELEASE: ${{ github.ref_name }}
        run: |
          docker build --file docker/fork/Dockerfile \
            --build-arg "SOURCE_URL=https://github.com/$GITHUB_REPOSITORY" \
            --build-arg "REVISION=$GITHUB_SHA" \
            --build-arg "RELEASE=$RELEASE" \
            --tag "$IMAGE" .

      - name: Check production runtime and built assets
        run: |
          docker run --rm --network none \
            -e CMD_DEFAULT_BACKGROUND=none \
            -e CMD_SESSION_SECRET=release-smoke-test-only \
            --entrypoint node "$IMAGE" -e '
              const assert = require("assert")
              const fs = require("fs")
              assert.strictEqual(require("./lib/config").defaultBackground, "none")
              assert(fs.existsSync("public/views/build/index-pack-header.ejs"))
              assert(fs.existsSync("public/views/build/pretty-pack-header.ejs"))
              assert(fs.readdirSync("public/build").some(name => name.endsWith(".js")))
              assert.strictEqual(process.getuid(), 10000)
            '

      - name: Sign in to GHCR and publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          echo "Published: $IMAGE" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release after image publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE" >/dev/null 2>&1; then
            if [[ "$RELEASE" == 'profundarium-v1.12.0-2' ]]; then
              cat > release-notes.md <<'NOTES'
          Security backports on the HedgeDoc 1.12.0 base, preserving the fork's backgrounds, audio controls, TOC styling, native navigation, and media support.

          Includes HTML/SVG sanitization, safer slideshow and export rendering, profile URL/name escaping, malformed-selection protection, history-key hardening, stricter HTTP/realtime read permissions, and email-login timing protection. Updates DOMPurify to 3.4.17 and Markdown-it to 14.3.3.

          Fixes per-note backgrounds in published notes. No account schema migration or major dependency upgrade is included. The cross-provider impersonation issue remains deferred; instances using multiple external authentication providers must assess overlapping profile IDs separately.

          Validated with 49 tests, lint, Alpine image build/startup, and browser checks for fork features.

          Image: `ghcr.io/turbulentarius/profundarium-hedgedoc-fork:profundarium-v1.12.0-2`

          This release replaces `profundarium-v1.12.0-1`; the previous GitHub Release and tagged image version are retired after publication.
          NOTES
              gh release create "$RELEASE" --verify-tag --title "$RELEASE" --notes-file release-notes.md
            elif [[ "$RELEASE" == 'profundarium-v1.12.0-3' ]]; then
              cat > release-notes.md <<'NOTES'
          Refines note spacing: the infobar has a -45px bottom margin, and note cards have 5rem top padding and a 2rem top margin.

          Retains the security backports, backgrounds, audio controls, media support, TOC styling, and native navigation from release 2. Simplifies regression coverage; all 47 tests pass. No database schema changes are included. The cross-provider impersonation issue remains deferred.

          Image: `ghcr.io/turbulentarius/profundarium-hedgedoc-fork:profundarium-v1.12.0-3`

          Replaces release 2; its GitHub Release and tagged image version are removed after successful publication.
          NOTES
              gh release create "$RELEASE" --verify-tag --title "$RELEASE" --notes-file release-notes.md
            elif [[ "$RELEASE" == 'profundarium-v1.12.0-4' ]]; then
              cat > release-notes.md <<'NOTES'
          Joins the infobar and note visually using matching backgrounds and aligned widths, while preserving their separate DOM elements. Removes negative-margin positioning. The infobar has 1rem top corners and the note has 1rem bottom corners, with light and night theme support.

          Validated with desktop/mobile browser checks in editor and published views, local frontend build, lint, and 47 regression tests. Retains the existing security backports; no database schema changes. The cross-provider impersonation issue remains deferred.

          Image: `ghcr.io/turbulentarius/profundarium-hedgedoc-fork:profundarium-v1.12.0-4`

          Replaces release 3; its GitHub Release and tagged image version are removed only after successful publication.
          NOTES
              gh release create "$RELEASE" --verify-tag --title "$RELEASE" --notes-file release-notes.md
            else
              gh release create "$RELEASE" --verify-tag --title "$RELEASE" --generate-notes
            fi
          fi

  retire-previous-release:
    # One-time retirement explicitly requested for the joined infobar/card release.
    # Never delete the package itself: it also contains the replacement image.
    if: github.ref == 'refs/tags/profundarium-v1.12.0-4'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Retire only the superseded release and image version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view profundarium-v1.12.0-4 >/dev/null
          endpoint="users/Turbulentarius/packages/container/profundarium-hedgedoc-fork/versions"
          gh api --paginate --slurp "$endpoint?per_page=100" > versions.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          versions = [version for page in json.loads(Path('versions.json').read_text()) for version in page]
          old_tag = 'profundarium-v1.12.0-3'
          new_tag = 'profundarium-v1.12.0-4'
          assert any(new_tag in version['metadata']['container']['tags'] for version in versions), 'Replacement image missing'
          retiring = []
          for version in versions:
              tags = version['metadata']['container']['tags']
              if old_tag in tags:
                  assert tags == [old_tag], 'Refusing to delete an image version with other tags'
                  assert isinstance(version['id'], int)
                  retiring.append(str(version['id']))
          Path('retiring-versions.txt').write_text(''.join(version + '\n' for version in retiring))
          PY
          while IFS= read -r version; do
            gh api --method DELETE "$endpoint/$version"
          done < retiring-versions.txt
          if gh release view profundarium-v1.12.0-3 >/dev/null 2>&1; then
            gh release delete profundarium-v1.12.0-3 --yes
          fi
          echo 'Retired the previous release and its tagged image version; replacement preserved.' >> "$GITHUB_STEP_SUMMARY"
